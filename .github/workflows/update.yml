name: Update Neovide nightly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the detected update to AUR'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Detect latest nightly
        id: nightly
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          curl -fL \
            -o "$tmpdir/neovide-linux-x86_64.tar.gz" \
            'https://github.com/neovide/neovide/releases/download/nightly/neovide-linux-x86_64.tar.gz'

          tar -xzf "$tmpdir/neovide-linux-x86_64.tar.gz" -C "$tmpdir"

          upstream_version="$("$tmpdir/neovide" --version)"

          echo "Upstream version: $upstream_version"

          pkgver="$(
            sed -E \
              's/^neovide (nightly)-([0-9]+)\+(g[0-9a-f]+)$/\1.r\2.\3/' \
              <<< "$upstream_version"
          )"

          test -n "$pkgver"

          echo "Latest pkgver: $pkgver"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          set -euo pipefail

          current="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          latest='${{ steps.nightly.outputs.pkgver }}'

          echo "Current: $current"
          echo "Latest:  $latest"

          if [[ "$current" == "$latest" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD
        if: steps.compare.outputs.needed == 'true'
        run: |
          set -euo pipefail

          sed -i \
            -E 's/^pkgver=.*/pkgver=${{ steps.nightly.outputs.pkgver }}/' \
            PKGBUILD

          sed -i \
            -E 's/^pkgrel=.*/pkgrel=1/' \
            PKGBUILD

      - name: Prepare Arch packaging environment
        if: steps.compare.outputs.needed == 'true'
        run: |
          docker pull archlinux:base-devel

      - name: Update checksums and .SRCINFO
        if: steps.compare.outputs.needed == 'true'
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/pkg" \
            -w /pkg \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed pacman-contrib

              uid="$(stat -c "%u" /pkg)"
              gid="$(stat -c "%g" /pkg)"

              groupadd --gid "$gid" builder
              useradd --uid "$uid" --gid "$gid" --create-home builder

              su builder -s /bin/bash -c "
                cd /pkg
                updpkgsums
                makepkg --printsrcinfo > .SRCINFO
              "
            '

      - name: Show update
        if: steps.compare.outputs.needed == 'true'
        run: |
          echo '===== PKGBUILD ====='
          git diff -- PKGBUILD

          echo '===== .SRCINFO ====='
          git diff -- .SRCINFO

      - name: Configure AUR SSH
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repository
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail

          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes' \
            git clone \
            ssh://aur@aur.archlinux.org/neovide-nightly-bin.git \
            aur

      - name: Publish to AUR
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail

          cp PKGBUILD .SRCINFO aur/

          cd aur

          git config user.name 'AUR Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add PKGBUILD .SRCINFO

          git commit \
            -m "Update to ${{ steps.nightly.outputs.pkgver }}"

          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes' \
            git push origin master

      - name: Commit GitHub repository
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail

          git config user.name 'AUR Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add PKGBUILD .SRCINFO

          git commit \
            -m "Update to ${{ steps.nightly.outputs.pkgver }}"

          git push origin main
