name: Update Neovide nightly

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the detected update to AUR"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Detect latest nightly
        id: nightly
        run: |
          set -euo pipefail

          sources="$RUNNER_TEMP/neovide-sources"
          extract="$RUNNER_TEMP/neovide-extract"
          rm -rf "$sources" "$extract"
          mkdir -p "$sources" "$extract"

          curl -fL --retry 3 --retry-all-errors \
            -o "$sources/neovide-linux-x86_64.tar.gz" \
            'https://github.com/neovide/neovide/releases/download/nightly/neovide-linux-x86_64.tar.gz'

          curl -fL --retry 3 --retry-all-errors \
            -o "$sources/neovide.desktop" \
            'https://raw.githubusercontent.com/neovide/neovide/nightly/assets/neovide.desktop'

          curl -fL --retry 3 --retry-all-errors \
            -o "$sources/neovide.svg" \
            'https://raw.githubusercontent.com/neovide/neovide/nightly/assets/neovide.svg'

          curl -fL --retry 3 --retry-all-errors \
            -o "$sources/LICENSE" \
            'https://raw.githubusercontent.com/neovide/neovide/nightly/LICENSE'

          for file in \
            neovide-linux-x86_64.tar.gz \
            neovide.desktop \
            neovide.svg \
            LICENSE
          do
            test -s "$sources/$file" || {
              echo "::error::Missing or empty source: $file"
              exit 1
            }
          done

          tar -xzf "$sources/neovide-linux-x86_64.tar.gz" -C "$extract"

          upstream_version="$("$extract/neovide" --version)"
          echo "Upstream version: $upstream_version"

          pkgver="$(
            sed -E \
              's/^neovide (nightly)-([0-9]+)\+(g[0-9a-f]+)$/\1.r\2.\3/' \
              <<< "$upstream_version"
          )"

          if [[ ! "$pkgver" =~ ^nightly\.r[0-9]+\.g[0-9a-f]+$ ]]; then
            echo "::error::Could not parse version: $upstream_version"
            exit 1
          fi

          echo "Latest pkgver: $pkgver"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          set -euo pipefail

          current="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          latest='${{ steps.nightly.outputs.pkgver }}'

          echo "Current: $current"
          echo "Latest:  $latest"

          if [[ "$current" == "$latest" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD
        if: steps.compare.outputs.needed == 'true'
        run: |
          set -euo pipefail

          sed -i \
            -E 's/^pkgver=.*/pkgver=${{ steps.nightly.outputs.pkgver }}/' \
            PKGBUILD

          sed -i \
            -E 's/^pkgrel=.*/pkgrel=1/' \
            PKGBUILD

      - name: Prepare Arch packaging environment
        if: steps.compare.outputs.needed == 'true'
        run: |
          docker pull archlinux:base-devel

      - name: Update checksums and .SRCINFO
        if: steps.compare.outputs.needed == 'true'
        run: |
          set -euo pipefail

          python3 - "$RUNNER_TEMP/neovide-sources" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          sources = Path(sys.argv[1])
          names = [
              "neovide-linux-x86_64.tar.gz",
              "neovide.desktop",
              "neovide.svg",
              "LICENSE",
          ]

          hashes = []
          for name in names:
              path = sources / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty source: {path}")

              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              hashes.append(digest)
              print(f"{digest}  {name}")

          path = Path("PKGBUILD")
          content = path.read_text()
          replacement = "sha256sums=(\n" + "".join(
              f"    '{digest}'\n" for digest in hashes
          ) + ")"

          updated, count = re.subn(
              r"(?ms)^sha256sums=\(.*?\)",
              lambda _: replacement,
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not replace sha256sums in PKGBUILD")

          path.write_text(updated)
          PY

          docker run --rm \
            -v "$PWD:/pkg" \
            -w /pkg \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed pacman-contrib

              uid="$(stat -c "%u" /pkg)"
              gid="$(stat -c "%g" /pkg)"

              groupadd --gid "$gid" builder
              useradd --uid "$uid" --gid "$gid" --create-home builder

              su builder -s /bin/bash -c "
                cd /pkg
                makepkg --printsrcinfo > .SRCINFO
              "
            '

      - name: Show update
        if: steps.compare.outputs.needed == 'true'
        run: |
          echo '===== PKGBUILD ====='
          git diff -- PKGBUILD

          echo '===== .SRCINFO ====='
          git diff -- .SRCINFO

      - name: Configure AUR SSH
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repository
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail

          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes' \
            git clone \
            ssh://aur@aur.archlinux.org/neovide-nightly-bin.git \
            aur

      - name: Publish to AUR
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail

          cp PKGBUILD .SRCINFO aur/

          cd aur

          git config user.name 'AUR Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add PKGBUILD .SRCINFO

          git commit \
            -m "Update to ${{ steps.nightly.outputs.pkgver }}"

          GIT_SSH_COMMAND='ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes' \
            git push origin master

      - name: Commit GitHub repository
        if: steps.compare.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail

          git config user.name 'AUR Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add PKGBUILD .SRCINFO

          git commit \
            -m "Update to ${{ steps.nightly.outputs.pkgver }}"

          git push origin main
